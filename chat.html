```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetrix AI</title>

  <link rel="icon" type="image/png" href="vetrix-favicon-novo.png">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --bg:#090807;
      --sidebar:#0d0a08;
      --panel:#110d0a;
      --panel2:#15100c;
      --border:#3a2518;
      --orange:#ff7a1a;
      --orange-light:#ff9748;
      --text:#f4eee8;
      --dim:#a99b8f;
      --danger:#ff5c5c;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
      transition:
        background .25s ease,
        color .25s ease;
    }

    /* =========================
       MODO CLARO
       ========================= */

    body.light{
      --bg:#f5f2ef;
      --sidebar:#ebe5df;
      --panel:#ffffff;
      --panel2:#f3efeb;
      --border:#d7ccc2;
      --text:#241b15;
      --dim:#75685e;
      --orange:#e96512;
      --orange-light:#f27d2a;
      --danger:#d83c3c;
    }

    /* =========================
       LAYOUT
       ========================= */

    .app{
      display:flex;
      width:100%;
      height:100vh;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar{
      width:250px;
      height:100vh;
      background:var(--sidebar);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      padding:22px 15px;
      transition:
        background .25s ease,
        border-color .25s ease;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      padding:5px 8px 25px;
    }

    .brand img{
      width:52px;
      height:52px;
      object-fit:contain;
      flex-shrink:0;
    }

    .brand-name{
      color:var(--orange)!important;
      text-decoration:none!important;
      font-size:22px;
      font-weight:800;
      letter-spacing:-.5px;
      text-shadow:0 0 13px rgba(255,122,26,.18);
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .menu button,
    .menu a{
      width:100%;
      min-height:45px;
      border:1px solid transparent;
      border-radius:11px;
      background:transparent;
      color:var(--text);
      text-decoration:none;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 14px;
      font-size:14px;
      cursor:pointer;
      transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease;
      font-family:inherit;
    }

    .menu button:hover,
    .menu a:hover{
      background:var(--panel);
      border-color:var(--border);
    }

    .menu .active{
      background:rgba(255,122,26,.10);
      border-color:rgba(255,122,26,.18);
      color:var(--orange);
    }

    .menu-icon{
      width:21px;
      text-align:center;
      font-size:18px;
      flex-shrink:0;
    }

    .sidebar-bottom{
      margin-top:auto;
    }

    /* =========================
       MAIN
       ========================= */

    .main{
      flex:1;
      min-width:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--bg);
      transition:background .25s ease;
    }

    .topbar{
      height:74px;
      border-bottom:1px solid var(--border);
      background:var(--panel);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 30px;
      transition:
        background .25s ease,
        border-color .25s ease;
    }

    .top-title{
      font-size:18px;
      font-weight:750;
      color:var(--text);
    }

    .top-title span{
      color:var(--orange);
    }

    .mode-info{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--dim);
      font-size:13px;
    }

    .mode-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--orange);
      box-shadow:0 0 8px rgba(255,122,26,.55);
    }

    /* =========================
       CHAT AREA
       ========================= */

    .chat-area{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:35px 20px 150px;
    }

    .chat-content{
      width:min(900px,100%);
      margin:0 auto;
    }

    .welcome{
      min-height:calc(100vh - 280px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .welcome-logo{
      width:90px;
      height:90px;
      object-fit:contain;
      margin-bottom:20px;
      filter:drop-shadow(0 0 18px rgba(255,122,26,.18));
    }

    .welcome h1{
      font-size:30px;
      line-height:1.2;
      margin-bottom:10px;
      letter-spacing:-.7px;
    }

    .welcome h1 span{
      color:var(--orange);
    }

    .welcome p{
      color:var(--dim);
      max-width:620px;
      line-height:1.6;
      font-size:15px;
    }

    .profile-info{
      margin-top:19px;
      padding:10px 15px;
      border:1px solid var(--border);
      background:var(--panel);
      border-radius:10px;
      color:var(--dim);
      font-size:13px;
      transition:
        background .25s ease,
        border-color .25s ease;
    }

    .profile-info strong{
      color:var(--orange);
    }

    /* =========================
       MESSAGES
       ========================= */

    .message{
      display:flex;
      gap:12px;
      margin:0 auto 22px;
      max-width:850px;
    }

    .message.user{
      justify-content:flex-end;
    }

    .avatar{
      width:34px;
      height:34px;
      border-radius:9px;
      background:var(--panel);
      border:1px solid var(--border);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-shrink:0;
      overflow:hidden;
    }

    .avatar img{
      width:27px;
      height:27px;
      object-fit:contain;
    }

    .message.user .avatar{
      order:2;
      background:var(--orange);
      border-color:var(--orange);
      color:white;
      font-size:14px;
      font-weight:bold;
    }

    .bubble{
      max-width:min(700px,78%);
      padding:13px 16px;
      border-radius:14px;
      background:var(--panel);
      border:1px solid var(--border);
      color:var(--text);
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
    }

    .message.user .bubble{
      background:var(--orange);
      border-color:var(--orange);
      color:#fff;
    }

    /* =========================
       INPUT
       ========================= */

    .input-area{
      position:absolute;
      left:250px;
      right:0;
      bottom:0;
      padding:18px 25px 21px;
      background:linear-gradient(
        to top,
        var(--bg) 65%,
        transparent
      );
      pointer-events:none;
    }

    .input-wrap{
      width:min(900px,100%);
      margin:0 auto;
      pointer-events:auto;
    }

    .input-box{
      display:flex;
      align-items:flex-end;
      gap:10px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:15px;
      padding:9px;
      box-shadow:0 10px 35px rgba(0,0,0,.15);
      transition:
        background .25s ease,
        border-color .25s ease;
    }

    .input-box:focus-within{
      border-color:rgba(255,122,26,.55);
      box-shadow:
        0 0 0 3px rgba(255,122,26,.07),
        0 10px 35px rgba(0,0,0,.15);
    }

    textarea{
      flex:1;
      min-height:43px;
      max-height:130px;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-family:inherit;
      font-size:14px;
      padding:12px 9px;
    }

    textarea::placeholder{
      color:var(--dim);
    }

    .send-btn{
      width:43px;
      height:43px;
      border:0;
      border-radius:11px;
      background:var(--orange);
      color:#fff;
      cursor:pointer;
      font-size:19px;
      transition:
        transform .15s ease,
        background .15s ease;
    }

    .send-btn:hover{
      background:var(--orange-light);
      transform:translateY(-1px);
    }

    .input-note{
      text-align:center;
      color:var(--dim);
      font-size:11px;
      margin-top:8px;
    }

    /* =========================
       RESPONSIVO
       ========================= */

    @media(max-width:750px){
      .sidebar{
        width:72px;
        padding:18px 9px;
      }

      .brand{
        justify-content:center;
        padding-left:0;
        padding-right:0;
      }

      .brand img{
        width:45px;
        height:45px;
      }

      .brand-name{
        display:none;
      }

      .menu button,
      .menu a{
        justify-content:center;
        padding:0;
      }

      .menu-icon{
        font-size:19px;
      }

      .menu-label{
        display:none;
      }

      .input-area{
        left:72px;
        padding-left:13px;
        padding-right:13px;
      }

      .topbar{
        padding:0 16px;
      }

      .mode-info{
        font-size:11px;
      }

      .welcome h1{
        font-size:25px;
      }

      .bubble{
        max-width:84%;
      }
    }

    @media(max-width:500px){
      .top-title{
        font-size:16px;
      }

      .mode-info{
        display:none;
      }

      .chat-area{
        padding-top:20px;
      }

      .welcome{
        min-height:calc(100vh - 260px);
      }

      .welcome-logo{
        width:75px;
        height:75px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside class="sidebar">

      <div class="brand">
        <img src="vetrix-favicon-novo.png" alt="Vetrix AI">
        <a class="brand-name" href="chat.html">Vetrix AI</a>
      </div>

      <nav class="menu">

        <button class="active" onclick="newChat()">
          <span class="menu-icon">＋</span>
          <span class="menu-label">Novo chat</span>
        </button>

        <button onclick="showHistory()">
          <span class="menu-icon">◷</span>
          <span class="menu-label">Histórico</span>
        </button>

        <a href="configuracoes.html">
          <span class="menu-icon">⚙</span>
          <span class="menu-label">Configurações</span>
        </a>

      </nav>

      <div class="sidebar-bottom">

        <nav class="menu">
          <button onclick="showHelp()">
            <span class="menu-icon">❔</span>
            <span class="menu-label">Ajuda</span>
          </button>
        </nav>

      </div>

    </aside>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="main">

      <header class="topbar">

        <div class="top-title">
          <span>Vetrix</span> AI
        </div>

        <div class="mode-info">
          <span class="mode-dot"></span>
          <span id="modeText">Modo estudo</span>
        </div>

      </header>


      <section class="chat-area" id="chatArea">

        <div class="chat-content" id="chatContent">

          <div class="welcome" id="welcome">

            <img
              class="welcome-logo"
              src="vetrix-favicon-novo.png"
              alt="Vetrix AI"
            >

            <h1 id="welcomeTitle">
              Olá! Eu sou o <span>Vetrix AI</span>.
            </h1>

            <p id="welcomeText">
              Estou aqui para ajudar você a estudar, entender assuntos,
              organizar ideias e aprender de forma mais simples.
            </p>

            <div class="profile-info" id="profileInfo">
              <strong>Modo estudo</strong> ativado.
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =========================
       INPUT
       ========================= -->

  <div class="input-area">

    <div class="input-wrap">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Digite sua mensagem..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>

        <button
          class="send-btn"
          onclick="sendMessage()"
          aria-label="Enviar"
        >
          ➤
        </button>

      </div>

      <div class="input-note">
        O Vetrix pode cometer erros. Confira informações importantes.
      </div>

    </div>

  </div>


  <script>
    /* =========================================================
       CONFIGURAÇÕES
       ========================================================= */

    const defaultSettings = {
      theme: "dark",
      course: "",
      specificCourse: "",
      reason: "",
      mode: "Modo estudo",
      sensitiveProtection: true,
      parentalControl: false,
      conversationLimit: "60",
      storage: true,
      notifications: true,
      voiceTone: "Natural",
      language: "pt-BR"
    };


    function getSettings(){
      try{
        const saved = JSON.parse(
          localStorage.getItem("vetrixSettings") || "{}"
        );

        return {
          ...defaultSettings,
          ...saved
        };

      }catch(error){
        return {...defaultSettings};
      }
    }


    let settings = getSettings();


    /* =========================================================
       TEMA
       ========================================================= */

    function applyTheme(currentSettings = getSettings()){

      settings = currentSettings;

      document.body.classList.toggle(
        "light",
        settings.theme === "light"
      );
    }


    /* =========================================================
       SINCRONIZAÇÃO DO TEMA ENTRE AS ABAS
       ========================================================= */

    let vetrixChannel = null;

    if("BroadcastChannel" in window){

      vetrixChannel = new BroadcastChannel("vetrix_settings");

      vetrixChannel.onmessage = function(event){

        if(
          event.data &&
          event.data.type === "themeChanged"
        ){

          const newTheme = event.data.theme;

          settings = {
            ...getSettings(),
            theme: newTheme
          };

          applyTheme(settings);

        }

      };

    }


    /* =========================================================
       STORAGE EVENT
       ========================================================= */

    window.addEventListener("storage", function(event){

      if(event.key === "vetrixSettings"){

        settings = getSettings();

        applyTheme(settings);

        updateInterface();

      }

    });


    /* =========================================================
       INTERFACE
       ========================================================= */

    function updateInterface(){

      settings = getSettings();

      const modeText =
        document.getElementById("modeText");

      const welcomeTitle =
        document.getElementById("welcomeTitle");

      const welcomeText =
        document.getElementById("welcomeText");

      const profileInfo =
        document.getElementById("profileInfo");

      const input =
        document.getElementById("messageInput");


      const isStudy =
        settings.mode === "Modo estudo";


      if(modeText){

        modeText.textContent =
          isStudy
            ? "Modo estudo"
            : "Modo base";

      }


      if(isStudy){

        if(welcomeTitle){

          welcomeTitle.innerHTML =
            'Olá! Eu sou o <span>Vetrix AI</span>.';

        }

        if(welcomeText){

          welcomeText.textContent =
            "Estou aqui para ajudar você a estudar, entender assuntos, organizar ideias e aprender de forma mais simples.";

        }

        if(profileInfo){

          let courseText =
            settings.specificCourse ||
            settings.course ||
            settings.reason ||
            "seus estudos";

          profileInfo.innerHTML =
            "<strong>Modo estudo</strong> ativado · " +
            escapeHTML(courseText) +
            ".";

        }

        if(input){

          input.placeholder =
            "Digite o que você quer estudar...";

        }

      }else{

        if(welcomeTitle){

          welcomeTitle.innerHTML =
            'Olá! Eu sou o <span>Vetrix AI</span>.';

        }

        if(welcomeText){

          welcomeText.textContent =
            "Estou aqui para responder perguntas, ajudar com ideias e facilitar suas tarefas.";

        }

        if(profileInfo){

          profileInfo.innerHTML =
            "<strong>Modo base</strong> ativado.";

        }

        if(input){

          input.placeholder =
            "Digite sua mensagem...";

        }

      }

    }


    /* =========================================================
       NOVO CHAT
       ========================================================= */

    function newChat(){

      const content =
        document.getElementById("chatContent");

      content.innerHTML = `

        <div class="welcome" id="welcome">

          <img
            class="welcome-logo"
            src="vetrix-favicon-novo.png"
            alt="Vetrix AI"
          >

          <h1 id="welcomeTitle">
            Olá! Eu sou o <span>Vetrix AI</span>.
          </h1>

          <p id="welcomeText">
            Estou aqui para ajudar você a estudar, entender assuntos,
            organizar ideias e aprender de forma mais simples.
          </p>

          <div class="profile-info" id="profileInfo">
            <strong>Modo estudo</strong> ativado.
          </div>

        </div>

      `;

      updateInterface();

      document
        .getElementById("messageInput")
        .focus();

    }


    /* =========================================================
       ENVIAR MENSAGEM
       ========================================================= */

    function sendMessage(){

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if(!text) return;


      const welcome =
        document.getElementById("welcome");

      if(welcome){

        welcome.remove();

      }


      const chatContent =
        document.getElementById("chatContent");


      /* Mensagem do usuário */

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";

      userMessage.innerHTML = `

        <div class="bubble">
          ${escapeHTML(text)}
        </div>

        <div class="avatar">
          Você
        </div>

      `;

      chatContent.appendChild(userMessage);


      input.value = "";

      input.style.height = "43px";


      /* Resposta demonstrativa */

      const botMessage =
        document.createElement("div");

      botMessage.className =
        "message";

      botMessage.innerHTML = `

        <div class="avatar">
          <img
            src="vetrix-favicon-novo.png"
            alt="Vetrix"
          >
        </div>

        <div class="bubble">
          ${getDemoResponse(text)}
        </div>

      `;

      chatContent.appendChild(botMessage);


      scrollToBottom();


      /* Salvar histórico */

      if(settings.storage){

        saveChat(text);

      }

    }


    /* =========================================================
       RESPOSTA TEMPORÁRIA
       ========================================================= */

    function getDemoResponse(text){

      if(settings.mode === "Modo base"){

        return `
          Entendi! Você escreveu:<br><br>
          <strong>${escapeHTML(text)}</strong><br><br>
          O sistema de IA real ainda não está conectado.
          Quando a API do Vetrix estiver configurada, eu poderei
          responder sua mensagem de verdade.
        `;

      }


      return `
        Vamos estudar isso juntos! 📚<br><br>
        Você perguntou sobre:
        <strong>${escapeHTML(text)}</strong><br><br>
        A conexão com a IA real ainda está sendo configurada.
        Por enquanto, esta é uma resposta de demonstração do Vetrix.
      `;

    }


    /* =========================================================
       SALVAR CHAT
       ========================================================= */

    function saveChat(message){

      try{

        const chats =
          JSON.parse(
            localStorage.getItem("vetrixChats") || "[]"
          );

        chats.push({

          message:message,

          mode:settings.mode,

          date:new Date().toISOString()

        });


        localStorage.setItem(
          "vetrixChats",
          JSON.stringify(chats)
        );

      }catch(error){

        console.log(
          "Não foi possível salvar o histórico."
        );

      }

    }


    /* =========================================================
       HISTÓRICO
       ========================================================= */

    function showHistory(){

      const chats =
        JSON.parse(
          localStorage.getItem("vetrixChats") || "[]"
        );


      if(!chats.length){

        alert(
          "Ainda não há conversas salvas no histórico."
        );

        return;

      }


      let text =
        "Histórico recente:\n\n";


      const recent =
        chats.slice(-10).reverse();


      recent.forEach((chat,index)=>{

        const date =
          new Date(chat.date);

        text +=
          `${index + 1}. ${chat.message}\n`;

        text +=
          `   ${date.toLocaleString("pt-BR")}\n\n`;

      });


      alert(text);

    }


    /* =========================================================
       AJUDA
       ========================================================= */

    function showHelp(){

      alert(
        "Como usar o Vetrix:\n\n" +
        "• Digite uma pergunta no campo de mensagem.\n" +
        "• Use Novo chat para começar uma conversa nova.\n" +
        "• O Histórico mostra mensagens salvas.\n" +
        "• Em Configurações você pode alterar o tema e outras opções.\n\n" +
        "A IA real ainda será conectada ao Vetrix."
      );

    }


    /* =========================================================
       TECLADO
       ========================================================= */

    function handleKey(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }


    /* =========================================================
       AUTO RESIZE
       ========================================================= */

    function autoResize(textarea){

      textarea.style.height = "43px";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          130
        ) + "px";

    }


    /* =========================================================
       ROLAR PARA BAIXO
       ========================================================= */

    function scrollToBottom(){

      const area =
        document.getElementById("chatArea");

      setTimeout(()=>{

        area.scrollTop =
          area.scrollHeight;

      },50);

    }


    /* =========================================================
       SEGURANÇA DO HTML
       ========================================================= */

    function escapeHTML(text){

      return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    applyTheme(settings);

    updateInterface();

  </script>

</body>
</html>
