<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090807">
<title>Vetrix AI — Chat</title>
<link rel="icon" href="vetrix-favicon-novo.png">

<style>
:root {
  --bg:#090807;
  --sidebar:#110d0a;
  --panel:#15100c;
  --border:#3a2518;
  --orange:#ff7a1a;
  --orange2:#ff9748;
  --text:#f4eee8;
  --muted:#a99b8f;
}

* { box-sizing:border-box; }

body {
  margin:0;
  height:100vh;
  display:flex;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}

body.light {
  --bg:#f5f2ef;
  --sidebar:#fff;
  --panel:#f1ece7;
  --border:#d8c9bc;
  --text:#241b15;
  --muted:#75685e;
}

button,textarea { font:inherit; }

.sidebar {
  width:260px;
  min-width:260px;
  height:100%;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:20px 15px;
  display:flex;
  flex-direction:column;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 8px 25px;
  font-size:20px;
  font-weight:bold;
}

.brand img {
  width:43px;
  height:43px;
  object-fit:contain;
}

.orange { color:var(--orange); }

.new-chat {
  width:100%;
  padding:13px;
  background:var(--orange);
  border:0;
  border-radius:11px;
  color:#211006;
  font-weight:bold;
  cursor:pointer;
}

.side-label {
  color:var(--muted);
  font-size:12px;
  margin:27px 8px 12px;
}

.side-link {
  display:block;
  padding:12px;
  color:var(--muted);
  text-decoration:none;
  border-radius:9px;
  font-size:14px;
}

.side-link:hover {
  background:var(--panel);
  color:var(--text);
}

.sidebar-bottom {
  margin-top:auto;
}

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  height:100%;
}

.topbar {
  height:65px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.mode {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 13px;
  color:var(--text);
  font-size:13px;
}

.top-actions {
  display:flex;
  align-items:center;
  gap:10px;
}

.top-actions a {
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:35px 20px;
}

.message-list {
  max-width:790px;
  margin:auto;
}

.welcome {
  text-align:center;
  margin:12vh auto 40px;
}

.welcome img {
  width:75px;
  height:75px;
  object-fit:contain;
}

.welcome h1 {
  font-size:31px;
  margin:17px 0 8px;
}

.welcome p {
  color:var(--muted);
  font-size:15px;
}

.message {
  margin:22px 0;
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.avatar {
  width:35px;
  height:35px;
  min-width:35px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--panel);
  border:1px solid var(--border);
  font-weight:bold;
  color:var(--orange);
}

.message-content {
  flex:1;
  min-width:0;
  line-height:1.65;
  font-size:15px;
  overflow-wrap:anywhere;
}

.message-content strong {
  display:block;
  margin-bottom:5px;
}

.user .avatar {
  background:var(--orange);
  color:#211006;
}

.composer-area {
  padding:15px 20px 20px;
}

.composer {
  max-width:790px;
  margin:auto;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:17px;
  padding:12px;
}

.composer textarea {
  width:100%;
  border:0;
  outline:0;
  resize:none;
  min-height:48px;
  max-height:160px;
  background:transparent;
  color:var(--text);
  padding:9px;
  font-size:15px;
}

.composer-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px;
}

.composer-bottom span {
  color:var(--muted);
  font-size:11px;
}

.send {
  width:42px;
  height:42px;
  border:0;
  border-radius:11px;
  background:var(--orange);
  color:#211006;
  font-size:20px;
  cursor:pointer;
}

.send:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.disclaimer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:11px;
}

@media(max-width:650px) {
  .sidebar {
    width:65px;
    min-width:65px;
    padding:15px 7px;
  }

  .brand {
    justify-content:center;
    padding:5px 0 25px;
  }

  .brand img {
    width:40px;
  }

  .brand span,
  .side-label,
  .side-link span,
  .new-chat span {
    display:none;
  }

  .new-chat {
    font-size:20px;
    padding:12px 0;
  }

  .side-link {
    text-align:center;
    padding:13px 0;
    font-size:18px;
  }

  .topbar {
    padding:0 13px;
  }

  .messages {
    padding:20px 12px;
  }

  .composer-area {
    padding:10px;
  }

  .welcome h1 {
    font-size:25px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">

  <a class="brand" href="index.html">
    <img src="vetrix-logo-final.png" alt="Vetrix">
    <span>VETRIX <span class="orange">AI</span></span>
  </a>

  <button class="new-chat" onclick="newChat()">
    ＋ <span>Nova conversa</span>
  </button>

  <div class="side-label">MENU PRINCIPAL</div>

  <a class="side-link" href="index.html">⌂ <span>Início</span></a>
  <a class="side-link" href="chat.html">▤ <span>Conversas</span></a>
  <a class="side-link" href="#" onclick="showHistory()">◷ <span>Histórico</span></a>
  <a class="side-link" href="#" onclick="showHelp()">ⓘ <span>Ajuda</span></a>

  <div class="sidebar-bottom">
    <a class="side-link" href="configuracoes.html">⚙ <span>Configurações</span></a>
  </div>

</aside>

<main class="main">

  <header class="topbar">
    <div class="mode" id="modeLabel">Modo estudo</div>

    <div class="top-actions">
      <a href="configuracoes.html">Configurações ⚙</a>
    </div>
  </header>

  <section class="messages" id="messages">
    <div class="message-list" id="messageList">

      <div class="welcome" id="welcome">
        <img src="vetrix-logo-final.png" alt="Vetrix AI">
        <h1>Como posso ajudar <span class="orange">você?</span></h1>
        <p>Estude, pesquise, crie e desenvolva suas ideias.</p>
      </div>

    </div>
  </section>

  <section class="composer-area">
    <div class="composer">

      <textarea
        id="prompt"
        placeholder="Pergunte alguma coisa ao Vetrix..."
        rows="1"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"
      ></textarea>

      <div class="composer-bottom">
        <span>Vetrix AI</span>
        <button class="send" id="sendButton" onclick="sendMessage()">↑</button>
      </div>

    </div>

    <div class="disclaimer">
      O Vetrix pode cometer erros. Confira informações importantes.
    </div>
  </section>

</main>

<script>
const SETTINGS_KEY = 'vetrixSettings';
const CHATS_KEY = 'vetrixChats';

let chats = [];
let currentChat = [];

function getSettings() {
  try {
    return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
  } catch {
    return {};
  }
}

function updateInterface() {
  const settings = getSettings();

  document.body.classList.toggle(
    'light',
    settings.theme === 'light'
  );

  document.getElementById('modeLabel').textContent =
    settings.mode || 'Modo estudo';
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
  } catch {
    chats = [];
  }
}

function saveChat() {
  if (!currentChat.length) return;

  loadChats();

  const firstMessage = currentChat.find(m => m.role === 'user');

  const title = firstMessage
    ? firstMessage.content.slice(0, 45)
    : 'Nova conversa';

  const chat = {
    id: Date.now(),
    title,
    messages: currentChat,
    updatedAt: new Date().toISOString()
  };

  chats.unshift(chat);
  chats = chats.slice(0, 50);

  localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
}

function newChat() {
  currentChat = [];

  document.getElementById('messageList').innerHTML = `
    <div class="welcome" id="welcome">
      <img src="vetrix-logo-final.png" alt="Vetrix AI">
      <h1>Como posso ajudar <span class="orange">você?</span></h1>
      <p>Estude, pesquise, crie e desenvolva suas ideias.</p>
    </div>
  `;

  document.getElementById('prompt').value = '';
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[char]);
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');

  if (welcome) welcome.remove();

  const list = document.getElementById('messageList');

  const item = document.createElement('div');
  item.className = 'message ' + (role === 'user' ? 'user' : 'assistant');

  const name = role === 'user' ? 'Você' : 'Vetrix AI';
  const avatar = role === 'user' ? 'U' : 'V';

  item.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="message-content">
      <strong>${name}</strong>
      <div>${escapeHTML(content).replace(/\n/g, '<br>')}</div>
    </div>
  `;

  list.appendChild(item);

  document.getElementById('messages').scrollTop =
    document.getElementById('messages').scrollHeight;
}

function getDemoResponse(message) {
  return 'Recebi sua mensagem! A interface do Vetrix está funcionando, mas a conexão com uma inteligência artificial real ainda não foi configurada. Assim que o backend e a API forem autorizados, poderei responder de verdade. Por enquanto, não vou inventar respostas.';
}

function sendMessage() {
  const input = document.getElementById('prompt');
  const button = document.getElementById('sendButton');

  const message = input.value.trim();

  if (!message || button.disabled) return;

  currentChat.push({
    role: 'user',
    content: message
  });

  addMessage('user', message);

  input.value = '';
  autoResize(input);

  button.disabled = true;

  setTimeout(() => {
    const response = getDemoResponse(message);

    currentChat.push({
      role: 'assistant',
      content: response
    });

    addMessage('assistant', response);
    saveChat();

    button.disabled = false;
    input.focus();
  }, 400);
}

function handleKey(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function autoResize(element) {
  element.style.height = 'auto';
  element.style.height = Math.min(element.scrollHeight, 160) + 'px';
}

function showHistory() {
  loadChats();

  if (!chats.length) {
    alert('Você ainda não possui conversas salvas.');
    return;
  }

  const selection = chats.map((chat, index) =>
    `${index + 1}. ${chat.title}`
  ).join('\n');

  const choice = prompt(
    'Histórico de conversas:\n\n' +
    selection +
    '\n\nDigite o número da conversa que deseja abrir:'
  );

  const index = Number(choice) - 1;

  if (!Number.isInteger(index) || !chats[index]) return;

  currentChat = chats[index].messages || [];

  const list = document.getElementById('messageList');
  list.innerHTML = '';

  currentChat.forEach(message => {
    addMessage(message.role, message.content);
  });
}

function showHelp() {
  alert(
    'Ajuda do Vetrix AI\n\n' +
    'Digite sua mensagem no campo inferior e pressione Enter para enviar.\n\n' +
    'A conexão com a IA real ainda está em desenvolvimento.'
  );
}

window.addEventListener('storage', event => {
  if (event.key === SETTINGS_KEY) updateInterface();
});

window.addEventListener('focus', updateInterface);

updateInterface();
loadChats();

const initialMessage = sessionStorage.getItem('vetrixInitialMessage');

if (initialMessage) {
  sessionStorage.removeItem('vetrixInitialMessage');
  document.getElementById('prompt').value = initialMessage;
  sendMessage();
}
</script>

</body>
</html>
