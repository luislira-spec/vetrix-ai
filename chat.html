<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetrix AI</title>
  <link rel="icon" href="vetrix-favicon-novo.png">

  <style>
    :root {
      --bg: #090807;
      --panel: #110d0a;
      --panel2: #15100c;
      --border: #3a2518;
      --orange: #ff7a1a;
      --orange-light: #ff9748;
      --text: #f4eee8;
      --dim: #a99b8f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    header {
      height: 76px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: #0b0908;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--orange) !important;
      text-decoration: none;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .header-btn:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .chat-area {
      height: calc(100vh - 76px);
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 12vh;
    }

    .welcome img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: var(--orange);
    }

    .welcome p {
      color: var(--dim);
      font-size: 16px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 18px;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.5;
      display: none;
    }

    .user-message {
      background: var(--orange);
      color: #160c05;
      margin-left: auto;
      margin-right: max(calc((100% - 800px) / 2), 20px);
      width: fit-content;
    }

    .ai-message {
      background: var(--panel2);
      border: 1px solid var(--border);
      margin-left: max(calc((100% - 800px) / 2), 20px);
    }

    .input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: #0b0908;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 10px 8px 16px;
    }

    .input-box:focus-within {
      border-color: var(--orange);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      min-height: 25px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: var(--dim);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--orange);
      color: #170b04;
      font-size: 19px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background: var(--orange-light);
    }

    .mode {
      text-align: center;
      margin-top: 9px;
      color: var(--dim);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      .brand-name {
        font-size: 19px;
      }

      .header-btn {
        padding: 9px 11px;
      }

      .welcome h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="chat.html" class="brand">
    <img src="vetrix-favicon-novo.png" alt="Vetrix">
    <span class="brand-name">Vetrix AI</span>
  </a>

  <div class="header-buttons">
    <button class="header-btn" onclick="window.location.href='configuracoes.html'">
      ⚙️ Configurações
    </button>
  </div>
</header>

<main class="chat-area">

  <section class="messages" id="messages">

    <div class="welcome" id="welcome">
      <img src="vetrix-favicon-novo.png" alt="Vetrix">
      <h1>Como posso ajudar?</h1>
      <p>Estude, pesquise e aprenda com o Vetrix AI.</p>
    </div>

  </section>

  <section class="input-area">
    <div class="input-box">
      <textarea
        id="messageInput"
        placeholder="Pergunte alguma coisa..."
        rows="1"
      ></textarea>

      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div class="mode">
      Vetrix AI • Modo estudo
    </div>
  </section>

</main>

<script>
  const input = document.getElementById("messageInput");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    welcome.style.display = "none";

    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.style.display = "block";
    userMessage.textContent = text;

    messages.appendChild(userMessage);

    input.value = "";
    input.style.height = "25px";

    setTimeout(() => {
      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai-message";
      aiMessage.style.display = "block";
      aiMessage.textContent =
        "Esta é uma resposta de demonstração do Vetrix AI.";

      messages.appendChild(aiMessage);
      messages.scrollTop = messages.scrollHeight;
    }, 500);

    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
