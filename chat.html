<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetrix AI</title>
  <link rel="icon" href="vetrix-favicon-novo.png">

  <style>
    :root {
      --bg: #090807;
      --panel: #110d0a;
      --panel2: #15100c;
      --border: #3a2518;
      --orange: #ff7a1a;
      --orange-light: #ff9748;
      --text: #f4eee8;
      --dim: #a99b8f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA LATERAL */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 245px;
      height: 100vh;
      background: #0b0908;
      border-right: 1px solid var(--border);
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 9px 25px;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .sidebar-brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .sidebar-brand span {
      color: var(--orange);
      font-size: 21px;
      font-weight: 700;
      text-decoration: none;
    }

    .side-button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 12px 13px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      margin-bottom: 5px;
      transition: 0.2s;
    }

    .side-button:hover {
      background: var(--panel);
      border-color: var(--border);
      color: var(--orange);
    }

    .side-button.active {
      background: var(--panel);
      border-color: var(--border);
      color: var(--orange);
    }

    .sidebar-spacer {
      flex: 1;
    }

    /* ÁREA PRINCIPAL */
    .main {
      margin-left: 245px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 76px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: #0b0908;
    }

    .page-title {
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
    }

    .page-title span {
      color: var(--orange);
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 12vh;
    }

    .welcome img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: var(--orange);
    }

    .welcome p {
      color: var(--dim);
      font-size: 16px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 18px;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.5;
      display: none;
    }

    .user-message {
      background: var(--orange);
      color: #160c05;
      margin-left: auto;
      margin-right: max(calc((100% - 800px) / 2), 20px);
      width: fit-content;
    }

    .ai-message {
      background: var(--panel2);
      border: 1px solid var(--border);
      margin-left: max(calc((100% - 800px) / 2), 20px);
    }

    .input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: #0b0908;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 10px 8px 16px;
    }

    .input-box:focus-within {
      border-color: var(--orange);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      min-height: 25px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: var(--dim);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--orange);
      color: #170b04;
      font-size: 19px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background: var(--orange-light);
    }

    .mode {
      text-align: center;
      margin-top: 9px;
      color: var(--dim);
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 205px;
      }

      .main {
        margin-left: 205px;
      }
    }

    @media (max-width: 560px) {
      .sidebar {
        width: 68px;
        padding: 18px 8px;
      }

      .sidebar-brand {
        justify-content: center;
        padding: 5px 0 18px;
      }

      .sidebar-brand span {
        display: none;
      }

      .side-button {
        text-align: center;
        padding: 12px 5px;
        font-size: 0;
      }

      .side-button::first-letter {
        font-size: 18px;
      }

      .main {
        margin-left: 68px;
      }

      header {
        padding: 0 18px;
      }

      .welcome h1 {
        font-size: 27px;
      }
    }
  </style>

</head>

<body>

  <aside class="sidebar">

```
<a href="chat.html" class="sidebar-brand">
  <img src="vetrix-favicon-novo.png" alt="Vetrix">
  <span>Vetrix AI</span>
</a>

<button class="side-button active" onclick="newChat()">
  ＋ Novo chat
</button>

<button class="side-button" onclick="alert('O histórico de conversas será conectado à conta do Vetrix.')">
  🕘 Histórico
</button>

<button class="side-button" onclick="alert('Central de ajuda do Vetrix.')">
  ❔ Ajuda
</button>

<button class="side-button" onclick="window.location.href='configuracoes.html'">
  ⚙️ Configurações
</button>

<div class="sidebar-spacer"></div>

<button class="side-button" onclick="toggleMode()">
  🎓 Modo Estudo
</button>
```

  </aside>

  <main class="main">

```
<header>
  <div class="page-title">
    <span>Vetrix AI</span>
  </div>
</header>

<section class="chat-area">

  <section class="messages" id="messages">

    <div class="welcome" id="welcome">
      <img src="vetrix-favicon-novo.png" alt="Vetrix">
      <h1>Como posso ajudar?</h1>
      <p>Estude, pesquise e aprenda com o Vetrix AI.</p>
    </div>

  </section>

  <section class="input-area">

    <div class="input-box">
      <textarea
        id="messageInput"
        placeholder="Pergunte alguma coisa..."
        rows="1"
      ></textarea>

      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div class="mode" id="modeText">
      Vetrix AI • Modo estudo
    </div>

  </section>

</section>
```

  </main>

<script>
  const input = document.getElementById("messageInput");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const modeText = document.getElementById("modeText");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    welcome.style.display = "none";

    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.style.display = "block";
    userMessage.textContent = text;

    messages.appendChild(userMessage);

    input.value = "";
    input.style.height = "25px";

    setTimeout(() => {
      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai-message";
      aiMessage.style.display = "block";
      aiMessage.textContent =
        "Esta é uma resposta de demonstração do Vetrix AI.";

      messages.appendChild(aiMessage);
      messages.scrollTop = messages.scrollHeight;
    }, 500);

    messages.scrollTop = messages.scrollHeight;
  }

  function newChat() {
    messages.innerHTML = `
      <div class="welcome" id="welcome">
        <img src="vetrix-favicon-novo.png" alt="Vetrix">
        <h1>Como posso ajudar?</h1>
        <p>Estude, pesquise e aprenda com o Vetrix AI.</p>
      </div>
    `;
  }

  function toggleMode() {
    const current = localStorage.getItem("vetrixModo") || "estudo";

    if (current === "estudo") {
      localStorage.setItem("vetrixModo", "base");
      modeText.textContent = "Vetrix AI • Modo base";
    } else {
      localStorage.setItem("vetrixModo", "estudo");
      modeText.textContent = "Vetrix AI • Modo estudo";
    }
  }

  function loadMode() {
    const mode = localStorage.getItem("vetrixModo") || "estudo";

    if (mode === "base") {
      modeText.textContent = "Vetrix AI • Modo base";
    } else {
      modeText.textContent = "Vetrix AI • Modo estudo";
    }
  }

  loadMode();
</script>

</body>
</html>
