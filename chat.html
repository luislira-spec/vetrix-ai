```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vetrix AI</title>
<link rel="icon" href="vetrix-favicon-novo.png">

<style>
:root{
  --bg:#090807;
  --sidebar:#0d0a08;
  --panel:#110d0a;
  --panel2:#15100c;
  --border:#3a2518;
  --orange:#ff7a1a;
  --orange-light:#ff9748;
  --text:#f4eee8;
  --dim:#a99b8f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* LAYOUT */

.app{
  display:flex;
  height:100vh;
}

/* BARRA LATERAL */

.sidebar{
  width:245px;
  height:100vh;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:22px 16px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 8px 28px;
}

.logo-area img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-name{
  color:var(--orange) !important;
  text-decoration:none !important;
  font-size:22px;
  font-weight:700;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.menu button,
.menu a{
  width:100%;
  border:none;
  background:transparent;
  color:var(--dim);
  text-decoration:none;
  padding:13px 14px;
  border-radius:10px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.menu button:hover,
.menu a:hover{
  background:#19110c;
  color:var(--text);
}

.menu .active{
  background:#21150e;
  color:var(--orange-light);
}

.sidebar-bottom{
  margin-top:auto;
}

.sidebar-bottom button{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--dim);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.sidebar-bottom button:hover{
  color:var(--text);
  border-color:var(--orange);
}

/* CHAT */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:76px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 30px;
  background:rgba(9,8,7,.92);
}

.chat-header-title{
  color:var(--orange) !important;
  text-decoration:none !important;
  font-size:20px;
  font-weight:700;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:55px 20px 120px;
}

.welcome{
  max-width:720px;
  margin:0 auto;
  text-align:center;
}

.welcome img{
  width:75px;
  height:75px;
  object-fit:contain;
  margin-bottom:18px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--dim);
  font-size:15px;
}

/* MENSAGEM */

.message{
  max-width:720px;
  margin:28px auto;
}

.message .name{
  color:var(--orange-light);
  font-size:14px;
  margin-bottom:8px;
  font-weight:bold;
}

.message .bubble{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px 17px;
  line-height:1.5;
}

/* INPUT */

.input-area{
  padding:18px 25px 24px;
  background:linear-gradient(transparent,var(--bg) 25%);
}

.input-box{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:8px;
}

.input-box:focus-within{
  border-color:var(--orange);
}

.input-box textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  padding:10px;
  min-height:42px;
  max-height:120px;
}

.send{
  width:43px;
  height:43px;
  border:none;
  border-radius:10px;
  background:var(--orange);
  color:#160b04;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
}

.send:hover{
  background:var(--orange-light);
}

/* MOBILE */

@media(max-width:700px){
  .sidebar{
    width:190px;
  }

  .logo-area{
    padding-left:3px;
  }

  .brand-name{
    font-size:18px;
  }

  .chat-header{
    padding:0 18px;
  }

  .messages{
    padding-top:35px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- BARRA LATERAL -->
  <aside class="sidebar">

    <div class="logo-area">
      <img src="vetrix-favicon-novo.png" alt="Vetrix">
      <a href="chat.html" class="brand-name">Vetrix AI</a>
    </div>

    <nav class="menu">

      <button class="active" onclick="novoChat()">
        ＋ Novo chat
      </button>

      <button onclick="alert('Os chats recentes aparecerão aqui.')">
        ◷ Histórico
      </button>

      <a href="configuracoes.html">
        ⚙ Configurações
      </a>

    </nav>

    <div class="sidebar-bottom">
      <button onclick="alert('Ajuda do Vetrix AI')">
        ❔ Ajuda
      </button>
    </div>

  </aside>


  <!-- CHAT -->
  <main class="chat">

    <header class="chat-header">
      <a href="chat.html" class="chat-header-title">Vetrix AI</a>
    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">

        <img src="vetrix-favicon-novo.png" alt="Vetrix AI">

        <h1>Olá! Eu sou o Vetrix AI.</h1>

        <p>
          Posso ajudar você a estudar, aprender e tirar dúvidas.
        </p>

      </div>

    </section>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Digite sua mensagem..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">➤</button>

      </div>

    </div>

  </main>

</div>


<script>

function sendMessage(){

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if(!text) return;

  const welcome = document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const messages = document.getElementById("messages");

  const userMessage = document.createElement("div");
  userMessage.className = "message";

  userMessage.innerHTML = `
    <div class="name">Você</div>
    <div class="bubble">${escapeHTML(text)}</div>
  `;

  messages.appendChild(userMessage);

  input.value = "";

  setTimeout(() => {

    const vetrixMessage = document.createElement("div");
    vetrixMessage.className = "message";

    vetrixMessage.innerHTML = `
      <div class="name">Vetrix AI</div>
      <div class="bubble">
        Esta é uma resposta de demonstração do Vetrix AI.
      </div>
    `;

    messages.appendChild(vetrixMessage);
    messages.scrollTop = messages.scrollHeight;

  },500);

}

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function handleKey(event){

  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }

}

function novoChat(){
  location.reload();
}

</script>

</body>
</html>
