<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vetrix AI">
<title>Vetrix AI — Chat</title>
<link rel="icon" type="image/png" href="vetrix-favicon-novo.png">
<style>
:root{--bg:#0b0a09;--panel:#12100e;--border:#33271e;--orange:#ff7a1a;--text:#f7f2ed;--muted:#aaa099}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,textarea{font:inherit}button{cursor:pointer}.top{height:74px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;background:#0d0b0a;border-bottom:1px solid #2a211a;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.brand img{width:38px;height:38px;object-fit:contain}.ai{color:var(--orange)}.topright{display:flex;gap:9px}.pill{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:20px;padding:9px 13px;font-weight:700}.study{border-color:var(--orange);color:var(--orange)}
.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 74px)}.side{background:#0e0c0b;border-right:1px solid #241c16;padding:17px 11px}.side button{width:100%;border:0;background:transparent;color:#aaa19b;text-align:left;padding:12px;border-radius:11px;margin-bottom:4px}.side .active{background:#191410;color:var(--orange)}.side .sep{border-top:1px solid #2a211a;margin-top:16px;padding-top:16px}
.chat{max-width:900px;width:100%;margin:auto;min-height:calc(100vh - 74px)}.messages{padding:28px 20px 145px}.msg{display:flex;gap:9px;max-width:800px;margin:0 auto 17px}.avatar{width:35px;height:35px;flex:0 0 35px;border:1px solid #57402d;border-radius:50%;display:grid;place-items:center;overflow:hidden}.avatar img{width:27px;height:27px;object-fit:contain}.bubble{padding:14px 16px;border-radius:17px;line-height:1.55;font-size:15px}.user{justify-content:flex-end}.user .bubble{background:var(--orange);color:#1b0d04;max-width:78%;border-bottom-right-radius:5px}.ai-msg .bubble{background:#15171a;border:1px solid #3a3f45;max-width:87%;border-bottom-left-radius:5px}.curiosity{max-width:800px;margin:8px auto 20px;border:1px solid var(--orange);border-radius:16px;background:#11100e;padding:14px 16px;display:flex;gap:12px}.curiosity strong{color:var(--orange);display:block;margin-bottom:4px}.curiosity p{margin:0;color:#c7beb7;font-size:13px}
.composer{position:fixed;left:215px;right:0;bottom:0;padding:30px 18px 17px;background:linear-gradient(transparent,#0b0a09 25%);z-index:8}.compose{max-width:800px;margin:auto;display:flex;gap:7px;align-items:center;border:1px solid #4a3b2e;background:#101010;border-radius:18px;padding:7px}.add,.send{width:42px;height:42px;border-radius:50%;background:transparent}.add{border:1px solid #77736f;color:white;font-size:24px}.send{border:1px solid var(--orange);color:var(--orange);font-size:19px}textarea{flex:1;background:transparent;color:var(--text);border:0;outline:0;resize:none;min-height:40px;max-height:120px;padding:9px}
.bottom{display:none}
@media(max-width:760px){
.top{height:70px;padding:0 14px}.brand{font-size:17px}.brand img{width:33px;height:33px}.topright .user{display:none}.pill{font-size:12px;padding:8px 10px}
.layout{display:block;min-height:calc(100vh - 70px)}.side{display:none}.chat{min-height:calc(100vh - 70px)}.messages{padding:17px 11px 145px}.msg{margin-bottom:14px}.avatar{width:31px;height:31px;flex-basis:31px}.avatar img{width:24px;height:24px}.bubble{font-size:14px;padding:12px 13px}.user .bubble{max-width:83%}.ai-msg .bubble{max-width:91%}.curiosity{margin:8px 4px 18px;padding:13px}
.composer{left:0;right:0;padding:23px 9px calc(76px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0a09 30%)}.compose{border-radius:18px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:rgba(12,10,9,.97);border-top:1px solid #2b2119;justify-content:space-around}.bottom button{border:0;background:transparent;color:#8f8781;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.bottom span{font-size:20px}.bottom .sel{color:var(--orange)}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html"><img src="vetrix-logo-final.png" alt="Vetrix AI"><span>VETRIX <span class="ai">AI</span></span></a><div class="topright"><button class="pill study" onclick="toggleMode()">🎓 <span id="mode">Modo Estudo</span></button><button class="pill user">👤 Luís</button></div></header>
<div class="layout">
<aside class="side"><button class="active" onclick="newChat()">💬 Nova conversa</button><button onclick="location.href='index.html'">⌂ Início</button><button onclick="alert('Histórico será conectado na próxima etapa.')">◷ Histórico</button><button onclick="alert('Configurações serão conectadas na próxima etapa.')">⚙ Configurações</button><button onclick="alert('Ajuda será conectada na próxima etapa.')">? Ajuda</button><div class="sep"><button onclick="toggleMode()">🎓 <span id="sideMode">Modo Estudo</span></button></div></aside>
<main class="chat"><section class="messages" id="messages">
</section></main></div>
<div class="composer"><div class="compose"><button class="add" onclick="alert('Anexos serão conectados quando a API estiver pronta.')">+</button><textarea id="q" rows="1" placeholder="Digite sua mensagem..."></textarea><button class="send" onclick="send()">➤</button></div></div>
<nav class="bottom"><button onclick="location.href='index.html'"><span>⌂</span>Início</button><button class="sel" onclick="newChat()"><span>◌</span>Chat</button><button onclick="alert('Histórico será conectado na próxima etapa.')"><span>◷</span>Histórico</button><button onclick="alert('Configurações serão conectadas na próxima etapa.')"><span>⚙</span>Configurações</button><button onclick="alert('Ajuda será conectada na próxima etapa.')"><span>?</span>Ajuda</button></nav>
<script>
const q=document.getElementById('q'),messages=document.getElementById('messages');

function send(){const t=q.value.trim();if(!t)return;const u=document.createElement('div');u.className='msg user';u.innerHTML='<div class="bubble"></div>';u.querySelector('.bubble').textContent=t;messages.appendChild(u);q.value='';q.style.height='auto';const a=document.createElement('div');a.className='msg ai-msg';a.innerHTML='<div class="avatar"><img src="vetrix-logo-final.png" alt="Vetrix"></div><div class="bubble"></div>';a.querySelector('.bubble').innerHTML='<b style="color:var(--orange)">Vetrix</b><br><br>Recebi sua mensagem. A interface está pronta; a resposta real será conectada quando a API for adicionada.';messages.appendChild(a);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,120)+'px'});
function newChat(){q.value='';q.focus()}function toggleMode(){const m=document.getElementById('mode'),s=document.getElementById('sideMode');const study=m.textContent==='Modo Estudo';m.textContent=study?'Modo Base':'Modo Estudo';s.textContent=study?'Modo Base':'Modo Estudo'}
</script>
</body>
</html>
