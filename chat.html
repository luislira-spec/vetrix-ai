
```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vetrix AI</title>
<link rel="icon" href="vetrix-favicon-novo.png">

<style>
:root{
  --bg:#090807;
  --sidebar:#0d0a08;
  --panel:#110d0a;
  --panel2:#15100c;
  --border:#3a2518;
  --orange:#ff7a1a;
  --orange-light:#ff9748;
  --text:#f4eee8;
  --dim:#a99b8f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  transition:background .25s,color .25s;
}

/* =========================
   APP
========================= */

.app{
  display:flex;
  height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:250px;
  height:100vh;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  flex-shrink:0;
  transition:background .25s,border-color .25s;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 8px 28px;
}

.logo-area img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-name{
  color:var(--orange) !important;
  text-decoration:none !important;
  font-size:22px;
  font-weight:700;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.menu button,
.menu a{
  width:100%;
  border:none;
  background:transparent;
  color:var(--dim);
  text-decoration:none;
  padding:13px 14px;
  border-radius:10px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.menu button:hover,
.menu a:hover{
  background:var(--panel2);
  color:var(--text);
}

.menu .active{
  background:#21150e;
  color:var(--orange-light);
}

.sidebar-bottom{
  margin-top:auto;
}

.sidebar-bottom button{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--dim);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.sidebar-bottom button:hover{
  color:var(--text);
  border-color:var(--orange);
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:76px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:var(--bg);
  transition:background .25s,border-color .25s;
}

.chat-header-title{
  color:var(--orange) !important;
  text-decoration:none !important;
  font-size:20px;
  font-weight:700;
}

.mode-info{
  color:var(--dim);
  font-size:13px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:55px 20px 120px;
}

.welcome{
  max-width:720px;
  margin:0 auto;
  text-align:center;
}

.welcome img{
  width:75px;
  height:75px;
  object-fit:contain;
  margin-bottom:18px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--dim);
  font-size:15px;
  line-height:1.5;
}

.profile-info{
  margin:20px auto 0;
  max-width:520px;
  padding:11px 14px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:10px;
  color:var(--dim);
  font-size:13px;
}

/* =========================
   MENSAGENS
========================= */

.message{
  max-width:720px;
  margin:28px auto;
}

.message .name{
  color:var(--orange-light);
  font-size:14px;
  margin-bottom:8px;
  font-weight:bold;
}

.message .bubble{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px 17px;
  line-height:1.5;
}

/* =========================
   INPUT
========================= */

.input-area{
  padding:18px 25px 24px;
  background:linear-gradient(
    transparent,
    var(--bg) 25%
  );
}

.input-box{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:8px;
}

.input-box:focus-within{
  border-color:var(--orange);
}

.input-box textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  padding:10px;
  min-height:42px;
  max-height:120px;
}

.send{
  width:43px;
  height:43px;
  border:none;
  border-radius:10px;
  background:var(--orange);
  color:#160b04;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
}

.send:hover{
  background:var(--orange-light);
}

/* =========================
   MODO CLARO
========================= */

body.light{
  --bg:#f5f2ef;
  --sidebar:#ebe5df;
  --panel:#ffffff;
  --panel2:#f3efeb;
  --border:#d7ccc2;
  --text:#241b15;
  --dim:#75685e;
}

body.light .menu .active{
  background:#f7e3d3;
  color:#d95f0a;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:750px){

  .sidebar{
    width:205px;
  }

  .chat-header{
    padding:0 18px;
  }

  .mode-info{
    display:none;
  }

}

@media(max-width:560px){

  .sidebar{
    width:175px;
    padding:18px 10px;
  }

  .logo-area{
    padding-left:3px;
  }

  .logo-area img{
    width:40px;
    height:40px;
  }

  .brand-name{
    font-size:17px;
  }

  .menu button,
  .menu a{
    font-size:13px;
    padding:11px 9px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo-area">
      <img src="vetrix-favicon-novo.png" alt="Vetrix AI">
      <a href="chat.html" class="brand-name">Vetrix AI</a>
    </div>

    <nav class="menu">

      <button class="active" onclick="newChat()">
        ＋ Novo chat
      </button>

      <button onclick="showHistory()">
        ◷ Histórico
      </button>

      <a href="configuracoes.html">
        ⚙ Configurações
      </a>

    </nav>

    <div class="sidebar-bottom">

      <button onclick="showHelp()">
        ❔ Ajuda
      </button>

    </div>

  </aside>


  <!-- CHAT -->

  <main class="chat">

    <header class="chat-header">

      <a href="chat.html" class="chat-header-title">
        Vetrix AI
      </a>

      <span id="modeInfo" class="mode-info"></span>

    </header>


    <section class="messages" id="messages">

      <div class="welcome" id="welcome">

        <img src="vetrix-favicon-novo.png" alt="Vetrix AI">

        <h1 id="welcomeTitle">
          Olá! Eu sou o Vetrix AI.
        </h1>

        <p id="welcomeText">
          Posso ajudar você a estudar, aprender e tirar dúvidas.
        </p>

        <div id="profileInfo" class="profile-info"></div>

      </div>

    </section>


    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Digite sua mensagem..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================
   CONFIGURAÇÕES
========================= */

const defaultSettings = {
  theme:"dark",
  course:"",
  specificCourse:"",
  reason:"",
  mode:"Modo estudo",
  sensitiveProtection:true,
  parentalControl:false,
  conversationLimit:"60",
  storage:true,
  notifications:true,
  voiceTone:"Natural",
  language:"pt-BR"
};

function getSettings(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("vetrixSettings")
      );

    return {
      ...defaultSettings,
      ...(saved || {})
    };

  }catch(error){

    return {...defaultSettings};

  }

}


/* =========================
   TEMA
========================= */

function applyTheme(){

  const settings = getSettings();

  document.body.classList.toggle(
    "light",
    settings.theme === "light"
  );

}


/* =========================
   INFORMAÇÕES DO CHAT
========================= */

function updateInterface(){

  const settings = getSettings();

  const modeInfo =
    document.getElementById("modeInfo");

  const welcomeTitle =
    document.getElementById("welcomeTitle");

  const welcomeText =
    document.getElementById("welcomeText");

  const profileInfo =
    document.getElementById("profileInfo");

  const input =
    document.getElementById("messageInput");


  /* MODO */

  if(settings.mode === "Modo base"){

    modeInfo.textContent = "Modo base";

    welcomeTitle.textContent =
      "Olá! Eu sou o Vetrix AI.";

    welcomeText.textContent =
      "Posso ajudar você com perguntas, ideias, informações e muito mais.";

    input.placeholder =
      "Pergunte alguma coisa...";

  }else{

    modeInfo.textContent =
      "📚 Modo estudo";

    welcomeTitle.textContent =
      "Olá! Vamos estudar?";

    welcomeText.textContent =
      "Posso explicar assuntos, ajudar em atividades e tornar seus estudos mais fáceis.";

    input.placeholder =
      "Digite sua dúvida de estudo...";

  }


  /* CURSO E MOTIVO */

  const parts = [];

  if(settings.course){
    parts.push(settings.course);
  }

  if(settings.specificCourse){
    parts.push(settings.specificCourse);
  }

  if(settings.reason &&
     settings.reason !== settings.course){

    parts.push("Uso: " + settings.reason);

  }

  if(parts.length){

    profileInfo.textContent =
      "Perfil: " + parts.join(" • ");

    profileInfo.style.display =
      "block";

  }else{

    profileInfo.style.display =
      "none";

  }


  /* IDIOMA */

  if(settings.language === "en"){

    welcomeText.textContent =
      "I can help you learn, understand subjects and answer your questions.";

  }

  if(settings.language === "es"){

    welcomeText.textContent =
      "Puedo ayudarte a estudiar, aprender y responder tus preguntas.";

  }

}


/* =========================
   ENVIAR MENSAGEM
========================= */

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text) return;


  const settings =
    getSettings();

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  const messages =
    document.getElementById("messages");


  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message";

  userMessage.innerHTML = `
    <div class="name">Você</div>
    <div class="bubble">${escapeHTML(text)}</div>
  `;

  messages.appendChild(userMessage);

  input.value = "";


  /* RESPOSTA DE DEMONSTRAÇÃO */

  setTimeout(() => {

    const vetrixMessage =
      document.createElement("div");

    vetrixMessage.className =
      "message";


    let response =
      "Esta é uma resposta de demonstração do Vetrix AI.";

    if(settings.mode === "Modo estudo"){

      response =
        "Estou no Modo estudo. Quando a API real estiver conectada, vou adaptar minhas respostas ao seu nível de estudo.";

    }


    if(settings.mode === "Modo base"){

      response =
        "Estou no Modo base. Quando a API real estiver conectada, vou responder às suas perguntas normalmente.";

    }


    vetrixMessage.innerHTML = `
      <div class="name">Vetrix AI</div>
      <div class="bubble">${response}</div>
    `;


    messages.appendChild(vetrixMessage);

    messages.scrollTop =
      messages.scrollHeight;


    /* SALVAR HISTÓRICO */

    if(settings.storage){

      saveMessage(text,response);

    }

  },500);

}


/* =========================
   SALVAR HISTÓRICO
========================= */

function saveMessage(userText,vetrixText){

  try{

    const chats =
      JSON.parse(
        localStorage.getItem("vetrixChats") || "[]"
      );

    chats.push({

      user:userText,
      vetrix:vetrixText,
      date:new Date().toISOString()

    });

    localStorage.setItem(
      "vetrixChats",
      JSON.stringify(chats)
    );

  }catch(error){

    console.log("Não foi possível salvar o histórico.");

  }

}


/* =========================
   NOVO CHAT
========================= */

function newChat(){

  location.reload();

}


/* =========================
   HISTÓRICO
========================= */

function showHistory(){

  const settings =
    getSettings();

  if(!settings.storage){

    alert(
      "O armazenamento do histórico está desativado nas configurações."
    );

    return;

  }

  let chats = [];

  try{

    chats =
      JSON.parse(
        localStorage.getItem("vetrixChats") || "[]"
      );

  }catch(error){}


  if(!chats.length){

    alert(
      "Você ainda não possui conversas salvas."
    );

    return;

  }


  alert(
    "Você possui " +
    chats.length +
    " mensagem(ns) registrada(s) no histórico."
  );

}


/* =========================
   AJUDA
========================= */

function showHelp(){

  alert(
    "Você pode personalizar o Vetrix em ⚙ Configurações."
  );

}


/* =========================
   ENTER
========================= */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   SEGURANÇA
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================
   INICIALIZAÇÃO
========================= */

applyTheme();
updateInterface();

</script>

</body>
</html>
```
